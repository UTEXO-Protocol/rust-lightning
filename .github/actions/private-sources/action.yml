name: Authenticate the pinned private RGB source
description: Configure Cargo's Git CLI fetches for the pinned BFA RGB graph.
inputs:
  token:
    description: Credential with read access to the pinned UTEXO-Protocol dependencies.
    required: true
runs:
  using: composite
  steps:
    - name: Configure scoped source authentication
      shell: bash
      env:
        UTEXO_SOURCE_READ_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [[ -z "$UTEXO_SOURCE_READ_TOKEN" ]]; then
          echo "::error::Configure ORG_READ_TOKEN or RGB_LIB_RUST_LIGHTNING_PAT with read access to the pinned BFA RGB graph."
          exit 1
        fi
        for repo in rgb-lib-bfa rgb-consensus-s-bfa rgb-ops-s-bfa rgb-api-s-bfa rgb-schemas-s-bfa; do
          git config --global \
            url."https://x-access-token:${UTEXO_SOURCE_READ_TOKEN}@github.com/UTEXO-Protocol/${repo}.git".insteadOf \
            "https://github.com/UTEXO-Protocol/${repo}.git"
        done
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
