name: Authenticate the pinned private RGB source
description: Configure Cargo's Git CLI fetches for rgb-lib-bfa.
inputs:
  token:
    description: Credential with read access to the pinned UTEXO-Protocol dependencies.
    required: true
runs:
  using: composite
  steps:
    - name: Configure scoped source authentication
      shell: bash
      env:
        UTEXO_SOURCE_READ_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [[ -z "$UTEXO_SOURCE_READ_TOKEN" ]]; then
          echo "::error::Configure ORG_READ_TOKEN or RGB_LIB_RUST_LIGHTNING_PAT with read access to rgb-lib-bfa."
          exit 1
        fi
        git config --global \
          url."https://x-access-token:${UTEXO_SOURCE_READ_TOKEN}@github.com/UTEXO-Protocol/rgb-lib-bfa.git".insteadOf \
          "https://github.com/UTEXO-Protocol/rgb-lib-bfa.git"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
