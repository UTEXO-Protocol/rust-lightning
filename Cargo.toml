[workspace]
resolver = "2"

# When the workspace members change, make sure to update the list here as well
# as in `ci/ci-tests.sh`.
members = [
    "lightning",
    "lightning-types",
    "lightning-block-sync",
    "lightning-invoice",
    "lightning-net-tokio",
    "lightning-persister",
    "lightning-background-processor",
    "lightning-rapid-gossip-sync",
    "lightning-custom-message",
    "lightning-macros",
    "lightning-dns-resolver",
    "lightning-liquidity",
    "possiblyrandom",
]

exclude = [
    "lightning-transaction-sync",
    "lightning-tests",
    "ext-functional-test-demo",
    "no-std-check",
    "msrv-no-dev-deps-check",
    "bench",
]

# Our tests do actual crypto and lots of work, the tradeoff for -O2 is well
# worth it. Note that we only apply optimizations to dependencies, not workspace
# crates themselves.
# https://doc.rust-lang.org/cargo/reference/profiles.html#profile-selection
[profile.dev.package."*"]
opt-level = 2

# It appears some minimal optimizations are required to inline many std methods
# and reduce the otherwise-substantial time spent in std self-checks. We do so
# here but ensure we keep LTO disabled as otherwise we're re-optimizing all our
# dependencies every time we make any local changes.
[profile.dev]
opt-level = 1
lto = "off"

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[workspace.lints.rust.unexpected_cfgs]
level = "forbid"
# When adding a new cfg attribute, ensure that it is added to this list.
#
# Note that Cargo automatically declares corresponding cfgs for every feature
# defined in the member-level [features] tables as "expected".
check-cfg = [
    "cfg(fuzzing)",
    "cfg(secp256k1_fuzz)",
    "cfg(hashes_fuzz)",
    "cfg(test)",
    "cfg(debug_assertions)",
    "cfg(c_bindings)",
    "cfg(ldk_bench)",
    "cfg(ldk_test_vectors)",
    "cfg(taproot)",
    "cfg(require_route_graph_test)",
    "cfg(simple_close)",
    "cfg(peer_storage)",
    "cfg(dual_funding)",
]

# Match the BFA.5 RGB graph used by RLN.
[patch.crates-io]
rgb-consensus = { git = "https://github.com/UTEXO-Protocol/rgb-consensus-s-bfa.git", rev = "af0b751dc9e51547cd57e025fdc3508e120ddf8a" }
rgb-ops = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa.git", rev = "ed1d60df69f9e4db65640c0ac61a5779ba9c018c" }
rgb-invoicing = { git = "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa.git", rev = "ed1d60df69f9e4db65640c0ac61a5779ba9c018c" }
rgb-psbt-utils = { git = "https://github.com/UTEXO-Protocol/rgb-api-s-bfa.git", rev = "8e2f515d0f6445e88d3c794a4b592f7bdd3a12df" }
rgb-schemas = { git = "https://github.com/UTEXO-Protocol/rgb-schemas-s-bfa.git", rev = "641a06f31cd277c42222504c8040055c8cbafca5" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-encoding-derive = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "8714cdcc8af25333c27214cdf9f42a6388d484ff" }
